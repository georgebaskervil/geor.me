name: Build and Push to Quay

on:
  pull_request:
  push:
    branches:
      - "main"

# One deploy per ref; new pushes to main cancel older in-flight main runs.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package-age-gates:
    name: Package age gates
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Check npm/Bun package ages
        shell: bash
        run: bun scripts/bun-age-gate.mjs

      - name: Check RubyGems package ages
        shell: bash
        run: ruby scripts/gem-age-gate.rb

  # PRs must never push images or redeploy — same-repo PRs still receive secrets.
  build-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Bypass Cloudflare for Github Action
        uses: ./.github/actions/bypass-cloudflare
        with:
          cf_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          cf_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Log in to Quay
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build Docker image
        env:
          B2_ASSETS_KEY_ID: ${{ secrets.B2_ASSETS_KEY_ID }}
          B2_ASSETS_SECRET: ${{ secrets.B2_ASSETS_SECRET }}
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --secret id=b2_key_id,env=B2_ASSETS_KEY_ID \
            --secret id=b2_secret,env=B2_ASSETS_SECRET \
            -t quay.io/georgebaskervil/personal_website_rails:latest .

      - name: Push to Quay.io
        run: |
          docker push quay.io/georgebaskervil/personal_website_rails:latest

      - name: Trigger Coolify Redeploy
        run: |
          curl -X GET "https://c.geor.me/api/v1/deploy?uuid=ugko8skkock08w4sw48s88kg&force=false" \
            -H "Content-Type: application/json" \
            -H "authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"
