# GitHub App install: Pull requests + Contents (write). Add Workflows (write) to merge PRs that touch .github/workflows/.
# Merge uses immediate rebase (not --auto); branch auto-merge does not need to be enabled in protection rules.
name: Auto approve

on:
  pull_request_target:
  workflow_dispatch:

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: hmarr/auto-approve-action@v4
        if: github.event_name == 'pull_request_target' && github.actor == 'dependabot[bot]'
        with:
          github-token: ${{ steps.app-token.outputs.token }}
      - name: Auto-merge Dependabot PR
        if: github.event_name == 'pull_request_target' && github.actor == 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          pr=${{ github.event.pull_request.number }}
          repo="${{ github.repository }}"
          bash scripts/wait-pr-checks-for-merge.sh "$pr" "$repo"
          gh pr merge "$pr" --repo "$repo" --rebase --delete-branch || {
            echo "Failed to merge PR #$pr ($(gh pr view "$pr" --repo "$repo" --json mergeStateStatus -q .mergeStateStatus))"
          }
      - name: Bulk approve Dependabot PRs
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          for pr in $(gh pr list --author dependabot[bot] --state open --json number --jq '.[].number'); do
            echo "Approving PR #$pr"
            gh pr review "$pr" --approve
            echo "Merging and cleaning up PR #$pr"
            if bash scripts/wait-pr-checks-for-merge.sh "$pr" "$repo"; then
              gh pr merge "$pr" --repo "$repo" --rebase --delete-branch || {
                echo "Failed to merge PR #$pr ($(gh pr view "$pr" --repo "$repo" --json mergeStateStatus -q .mergeStateStatus))"
              }
            else
              echo "Skipping merge for PR #$pr — Socket/Snyk not green"
            fi
          done
