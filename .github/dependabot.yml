version: 2
updates:
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # 0.7.59 C extension raises TypeError on Linux at runtime (see .snyk, AGENTS.md)
      - dependency-name: "iodine"
        versions: [">= 0.7.59"]
    cooldown:
      default-days: 10
      semver-major-days: 14
      semver-minor-days: 10
      semver-patch-days: 10
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 10
      semver-major-days: 14
      semver-minor-days: 10
      semver-patch-days: 10
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 10
      semver-major-days: 14
      semver-minor-days: 10
      semver-patch-days: 10
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 10
      semver-major-days: 14
      semver-minor-days: 10
      semver-patch-days: 10
